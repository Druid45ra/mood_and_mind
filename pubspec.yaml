name: mood_and_mind
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.0
  path: ^1.9.1
  google_fonts: ^6.2.1
  flutter_local_notifications: ^19.0.0
  table_calendar: ^3.1.3
  provider: ^6.1.2
  fl_chart: ^0.71.0
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  permission_handler: ^11.4.0
  intl: ^0.19.0
  intro_slider: ^3.0.0
  curved_navigation_bar: ^1.0.6
  rive: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo.png
    - assets/animations/smiling_emoji.riv
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
