name: mood_and_mind
description: A Flutter application for tracking mood and habits.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.0
  path: ^1.9.1
  google_fonts: ^6.2.1
  flutter_local_notifications: ^19.0.0
  table_calendar: ^3.1.2
  provider: ^6.1.2
  fl_chart: ^0.70.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
