name: mood_and_mind
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.1
  google_fonts: ^6.0.0
  flutter_local_notifications: ^19.1.0
  table_calendar: ^3.1.3
  provider: ^6.1.5
  fl_chart: ^0.71.0
  timezone: ^0.10.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  permission_handler: ^12.0.0+1
  intro_slider: ^4.0.2
  curved_navigation_bar: ^1.0.6
  logger: ^2.4.0
  file_picker: ^10.1.2
  image_picker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  # Nu mai avem nevoie de assets, deci le eliminăm

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
